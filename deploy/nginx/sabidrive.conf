# nginx reverse-proxy config for self-hosting SabiDrive on one VPS.
# Install: sudo cp deploy/nginx/sabidrive.conf /etc/nginx/sites-available/sabidrive.conf
#          sudo ln -s /etc/nginx/sites-available/sabidrive.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Plain HTTP only, on purpose — run `certbot --nginx -d ... -d ...` (see
# deploy/README.md, Phase 5) AFTER DNS for all four hostnames below resolves
# to this VPS. certbot rewrites this file in place to add the HTTPS server
# blocks + HTTP->HTTPS redirects; don't hand-add TLS directives here first.
#
# `proxy_set_header Host $host;` matters on every block below: the family
# app's own middleware.ts decides whether to serve /start based on the real
# incoming Host header (sabidrive.com vs family.sabidrive.com) — losing that
# header here would break that rewrite. No WebSocket upgrade headers are
# needed anywhere: Supabase Realtime connects browser-to-Supabase directly,
# never through this server.

server {
    listen 80;
    listen [::]:80;
    server_name sabidrive.com www.sabidrive.com family.sabidrive.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.sabidrive.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
